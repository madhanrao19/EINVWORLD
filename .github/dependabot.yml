version: 2
updates:
  # NuGet packages (main app + test project, both covered from the solution root).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Group routine Microsoft/EF Core/Serilog point releases into one PR instead of ten,
    # so CI (build + real SQL Server integration tests) runs once per batch, not once per package.
    groups:
      microsoft-and-efcore:
        patterns:
          - "Microsoft.*"
      serilog:
        patterns:
          - "Serilog.*"
    # Stay on .NET 10 (LTS) with its monthly patches; revisit .NET 11 once it reaches 11.0.1/11.0.2 (Dec 2026/Jan 2027).
    # Majors of the packages bound to the runtime are ignored; 10.0.x patches still arrive.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the CI workflow itself.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    # init and analyze must run the same version (CodeQL fails otherwise), so bump them in one PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # npm: the Playwright QA tooling (package.json). The vendored front-end libraries under wwwroot/assets/libs
  # and libman.json are not a format Dependabot reads; check those by hand when updating them.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
