name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Least privilege: the job only checks out, builds, tests and uploads an artifact (artifact upload uses its own runtime token).
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EINVWORLD.sln

      # Fails the run when any direct or transitive NuGet package has a known High/Critical advisory.
      - name: Vulnerable package check
        shell: pwsh
        run: |
          $report = dotnet list EINVWORLD.sln package --vulnerable --include-transitive --format json | ConvertFrom-Json
          $bad = foreach ($p in $report.projects) { foreach ($f in $p.frameworks) {
            foreach ($pkg in @($f.topLevelPackages) + @($f.transitivePackages)) {
              foreach ($v in $pkg.vulnerabilities) { if ($v.severity -in 'High','Critical') { "$($pkg.id) $($pkg.resolvedVersion): $($v.severity) $($v.advisoryurl)" } } } } }
          if ($bad) { $bad | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "No High/Critical vulnerable packages."

      - name: Build
        run: dotnet build EINVWORLD.sln --configuration Release --no-restore

      # windows-latest ships SQL Server Express LocalDB; start the default instance so the integration
      # tests run against a real SQL Server. If it's unavailable the tests no-op (see SqlServerFixture).
      - name: Start SQL Server LocalDB (integration tests)
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Test
        env:
          INTEGRATION_SQLSERVER: 'Server=(localdb)\MSSQLLocalDB;Trusted_Connection=True;TrustServerCertificate=True;'
        run: dotnet test EINVWORLD.sln --configuration Release --no-build --verbosity normal

      # Check on main that the app still publishes. The output is not uploaded: nothing downloads it
      # (scripts/Deploy-Staging.ps1 publishes locally), and at ~412 MB per build it filled the account's
      # Actions storage quota and failed every main run (Nov 2026).
      - name: Publish (main only)
        if: github.ref == 'refs/heads/main'
        run: dotnet publish EINVWORLD.csproj --configuration Release --output publish
