name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly sweep catches new CodeQL query-pack rules against unchanged code, not just new PRs.
    - cron: "23 3 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: windows-latest
    # Skipped while the repo is private: code scanning on private repos needs the paid GitHub Code
    # Security add-on, so every run fails with "Code scanning is not enabled for this repository".
    # Runs again automatically if the repo goes public (or remove this line once Code Security is enabled).
    # Compared to 'public' so a payload without repository info skips rather than fails.
    if: github.event.repository.visibility == 'public'
    permissions:
      contents: read
      security-events: write
      # The analyze step reads workflow-run metadata (for SARIF fingerprinting/baseline comparison) even
      # on a plain push/PR run — without this it fails post-analysis with "Resource not accessible by
      # integration" despite the scan itself succeeding.
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: csharp
          # security-extended adds broader query coverage beyond the default security-quality set.
          queries: security-extended

      # C# is a compiled language — CodeQL needs an actual build to trace through, not just a checkout.
      - name: Restore
        run: dotnet restore EINVWORLD.sln

      - name: Build
        run: dotnet build EINVWORLD.sln --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:csharp"
